name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          title: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to npm
        if: steps.changesets.outputs.hasChangesets == 'false'
        # Runs on every push to main without changesets, so a version npm already has is skipped
        # instead of failing the run.
        #
        # pnpm packs the tarball, because only pnpm turns `workspace:*` into the version it points to;
        # npm publishes it, because npm is what trusted publishing and provenance are documented for.
        # A tarball that still says `workspace:` would install nowhere, so it stops the run.
        run: |
          for dir in packages/*/; do
            manifest="${dir}package.json"
            [ "$(node -p "require('./${manifest}').private === true")" = "true" ] && continue
            name=$(node -p "require('./${manifest}').name")
            version=$(node -p "require('./${manifest}').version")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already published"
              continue
            fi
            tarball=$(cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP" --json | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8")).filename)')
            if tar -xOzf "$tarball" package/package.json | grep -q '"workspace:'; then
              echo "${name}@${version} still depends on workspace:, which npm cannot install"
              exit 1
            fi
            npm publish "$tarball" --access public --provenance
          done
