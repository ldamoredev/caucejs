name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          title: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to npm
        if: steps.changesets.outputs.hasChangesets == 'false'
        working-directory: packages/core
        run: |
          set -euo pipefail
          HOST=registry.npmjs.org
          ID_JSON=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:${HOST}")
          ID=$(printf '%s' "$ID_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          PKG=$(node -p "encodeURIComponent(require('./package.json').name)")
          echo "Exchanging OIDC token for ${PKG}"
          EXCHANGE=$(curl -sS -w "\nHTTP_CODE:%{http_code}" -X POST \
            -H "Authorization: Bearer ${ID}" \
            -H "Content-Type: application/json" \
            "https://${HOST}/-/npm/v1/oidc/token/exchange/package/${PKG}")
          TOKEN=$(EXCHANGE="$EXCHANGE" python3 - <<'PY'
          import json, os, sys
          raw = os.environ["EXCHANGE"]
          body, _, code = raw.rpartition("HTTP_CODE:")
          print("exchange status", code.strip(), file=sys.stderr)
          try:
              data = json.loads(body)
          except json.JSONDecodeError:
              print(body[:800], file=sys.stderr)
              sys.exit(1)
          if "token" not in data:
              print("exchange error:", data, file=sys.stderr)
              sys.exit(1)
          print("exchange ok", file=sys.stderr)
          print(data["token"])
          PY
          )
          npm config set "//registry.npmjs.org/:_authToken" "${TOKEN}"
          npm publish --access public --provenance
