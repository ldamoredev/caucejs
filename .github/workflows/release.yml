name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          title: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to npm
        if: steps.changesets.outputs.hasChangesets == 'false'
        working-directory: packages/core
        run: |
          echo "OIDC URL: ${ACTIONS_ID_TOKEN_REQUEST_URL:+set}"
          echo "OIDC TOKEN: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+set}"
          echo "NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:+set}"
          echo "NPM_CONFIG_USERCONFIG=${NPM_CONFIG_USERCONFIG-}"
          for f in "${NPM_CONFIG_USERCONFIG:-}" "$HOME/.npmrc" ".npmrc" "../../.npmrc"; do
            if [ -n "$f" ] && [ -f "$f" ]; then
              echo "---- npmrc $f ----"
              cat "$f"
              sed -i '/_authToken/d' "$f"
            fi
          done
          npm config list
          npm publish --access public --provenance
